<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Journey</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cutive+Mono&family=Gochi+Hand&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#E63946", // Washi Red
            "bg-paper": "#F1EFE7", // Warm Cream Paper
            "paper-white": "#FFFCF9", // Glossy Photo White
            ink: "#2B2D42", // Ink Blue
            pencil: "#8D99AE", // Faded Pencil
            accent: "#F4A261", // Kraft Paper Orange
            sticky: "#FFE66D", // Sticky Note Yellow
          },
          fontFamily: {
            display: ["Space Grotesk", "sans-serif"],
            hand: ["Gochi Hand", "cursive"],
            mono: ["Cutive Mono", "monospace"],
          },
          boxShadow: {
            float: "8px 8px 0px rgba(43, 45, 66, 0.1)",
            lift: "0px 20px 25px -5px rgba(0,0,0,0.15)",
            polaroid: "2px 2px 8px rgba(0,0,0,0.15)",
          },
          animation: {
            'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both',
            'draw': 'dash 5s linear forwards',
            'float': 'float 6s ease-in-out infinite',
          },
          keyframes: {
            shake: {
              '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
              '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
              '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
              '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
            },
            dash: {
              to: { strokeDashoffset: '0' }
            },
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-10px)' },
            }
          }
        },
      },
    }
  </script>
  <style>
    /* Noise Filter Class */
    .texture-overlay::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 50;
    }

    /* Tape Effect */
    .tape-edge {
      mask-image: linear-gradient(90deg, transparent 0%, black 2%, black 98%, transparent 100%);
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, black 2%, black 98%, transparent 100%);
    }

    /* Hide Scrollbar */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* 3D Transform Utilities */
    .perspective-1000 {
      perspective: 1000px;
    }

    .preserve-3d {
      transform-style: preserve-3d;
    }

    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .rotate-y-180 {
      transform: rotateY(180deg);
    }

    .transform-style-3d {
      transform-style: preserve-3d;
    }

    /* Page Transitions */
    .page-transition-wrapper {
      animation: pageTransition 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes pageTransition {
      from {
        opacity: 0;
        transform: scale(0.98) translateY(10px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* Mobile Interaction Optimization */
    @media (max-width: 640px) {
      .touch-action-none {
        touch-action: none;
      }
    }
  </style>
</head>

<body class="bg-bg-paper text-ink texture-overlay overflow-x-hidden antialiased selection:bg-primary/20">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
